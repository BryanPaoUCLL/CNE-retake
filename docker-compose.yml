services:
    azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        container_name: azurite
        ports:
            - "10000:10000"
            - "10001:10001"
            - "10002:10002"
        command: >
            azurite
            --blobHost 0.0.0.0
            --queueHost 0.0.0.0
            --tableHost 0.0.0.0
            --location /data
            --debug /data/debug.log
        volumes:
            - ./azurite_data:/data
