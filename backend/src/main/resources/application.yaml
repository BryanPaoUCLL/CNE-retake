spring:
    application:
        name: cloud-native-engineering-project-group2-backend

    datasource:
        url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

    jpa:
        defer-datasource-initialization: false
        hibernate:
            ddl-auto: update
        open-in-view: false

server:
    port: ${SERVER_PORT:8080}

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        enabled: true

app:
    cors:
        allowed-origins: ${FRONTEND_URLS}

---
spring:
    config:
        activate:
            on-profile: dev
---
spring:
    config:
        activate:
            on-profile: prod
app:
    cookie:
        domain: .somthing.be
        same-site: Strict
