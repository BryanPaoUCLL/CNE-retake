name: Build and push backend image to GitHub Container Registry - galerique-backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_galerique-backend.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set lowercase owner name
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cne-galerique-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/cne-galerique-backend:${{ github.sha }}

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend to Azure Container Apps
        run: |
          az containerapp update \
            --name cne-retake-backend \
            --resource-group CNE-retake \
            --image ghcr.io/${{ env.OWNER_LC }}/cne-galerique-backend:${{ github.sha }}
